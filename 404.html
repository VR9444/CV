<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/png" href="/VR.png" />
    <title>Temporarily unavailable</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 28px;
            color: #f7fbf8;
            font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            background:
                radial-gradient(circle at 20% 18%, rgba(121, 216, 199, 0.18), transparent 28%),
                linear-gradient(135deg, #081f24 0%, #102f36 58%, #231f16 100%);
        }

        main {
            width: min(100%, 560px);
            padding: 32px;
            border: 1px solid rgba(247, 251, 248, 0.18);
            border-radius: 8px;
            background: rgba(8, 31, 36, 0.78);
            box-shadow: 0 28px 80px rgba(0, 0, 0, 0.38);
        }

        .eyebrow {
            margin: 0 0 14px;
            color: #79d8c7;
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0 0 14px;
            color: #ffffff;
            font-size: clamp(2.2rem, 9vw, 4.3rem);
            line-height: 0.96;
            font-weight: 800;
            letter-spacing: 0;
        }

        p {
            margin: 0;
            color: rgba(247, 251, 248, 0.78);
            font-size: 1rem;
            line-height: 1.6;
        }
    </style>
</head>

<body>
    <main aria-labelledby="unavailable-title">
        <p class="eyebrow">Viktor Rackov</p>
        <h1 id="unavailable-title">Temporarily unavailable</h1>
        <p>This page is currently unavailable. Please check back later.</p>
    </main>
</body>

</html>
